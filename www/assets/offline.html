<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Jste bez připojení — Správa webů</title>
    <!--
        Stránka, kterou ukáže service worker (sw.js), když se nepodaří načíst
        správu ze sítě. Je to jediná věc, kterou service worker cachuje —
        a zároveň podmínka jeho instalace: bez tohohle souboru se worker
        nenainstaluje a nefunguje ani push (proto je na něj test v PwaTest).
        Je schválně soběstačná: žádný app.css ani písma, ty by bez sítě taky
        nebyly. Barvy odpovídají tokenům z dev/scss/base/_tokens.scss
        a modrému akcentu správy z _sprava.scss.
    -->
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f6f6f3; color: #17181c;
        }
        @media (prefers-color-scheme: dark) { body { background: #17181c; color: #f6f6f3; } }
        main { text-align: center; padding: 32px 24px; max-width: 360px; }
        /* Ilustrace „bez připojení" převzatá z klientské aplikace, vložená
           přímo — stránka žádné CSS ani obrázky ze sítě nenačítá. */
        :root { --color-primary: #3858e9; --color-surface: #fff; --color-border-default: #d6d6d0; --color-text-secondary: #5c5f66; --color-warning-text: #b45309; }
        @media (prefers-color-scheme: dark) { :root { --color-surface: #1f2126; --color-border-default: #3a3d45; --color-text-secondary: #a9adb8; } }
        svg { display: block; margin: 0 auto 20px; max-width: 180px; }
        .code { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin: 0 0 6px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { margin: 0 0 24px; opacity: .75; }
        button {
            font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 8px;
            background: #17181c; color: #fff; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) { button { background: #3e63dd; color: #fff; } }
    </style>
</head>
<body>
<main>
    <svg width="180" height="130" viewBox="0 0 180 130" fill="none" aria-hidden="true">
        <path d="M64 92 a17 17 0 0 1 1 -34 a25 25 0 0 1 47 -5 a15 15 0 0 1 5 39 z" fill="var(--color-surface)" stroke="var(--color-primary)" stroke-width="4" stroke-linejoin="round"></path>
        <path d="M46 34 L138 110" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round"></path>
        <path d="M26 100 a34 34 0 0 1 16 -26" stroke="var(--color-border-default)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6"></path>
        <path d="M156 100 a34 34 0 0 0 -16 -26" stroke="var(--color-border-default)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6"></path>
        <circle cx="80" cy="74" r="2.4" fill="var(--color-text-secondary)"></circle>
        <circle cx="104" cy="74" r="2.4" fill="var(--color-text-secondary)"></circle>
        <path d="M84 84 q8 -5 16 0" stroke="var(--color-text-secondary)" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
        <path d="M148 22 l4 8 8 2 -8 3 -4 8 -3 -8 -8 -3 8 -2 z" fill="var(--color-warning-text)" opacity=".8"></path>
    </svg>
    <p class="code">Bez připojení k internetu</p>
    <h1>Nejste připojení k internetu</h1>
    <p>Zkontrolujte signál nebo Wi-Fi. Jakmile bude spojení, načtěte stránku znovu.</p>
    <button type="button" onclick="location.reload()">Zkusit znovu</button>
</main>
</body>
</html>
